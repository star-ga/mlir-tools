name: Build MLIR Tools

on:
  workflow_dispatch:
    inputs:
      llvm_version:
        description: 'LLVM version to build; must be pinned in versions.txt (e.g. 23.1.3)'
        required: true
        default: '23.1.3'
      platforms:
        description: 'Comma-separated platforms (linux-x64,linux-arm64,macos-x64,macos-arm64,windows-x64) or "all"'
        required: true
        default: 'all'
      release:
        description: 'Publish a GitHub release (only when platforms is "all")'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      MLIR_TOOLS_ATTESTATION: auto
      LLVM_VERSION: ${{ inputs.llvm_version }}
      PLATFORMS: ${{ inputs.platforms }}
    steps:
      - uses: actions/checkout@v7

      - name: Normalize version
        id: version
        run: |
          v="${LLVM_VERSION#llvmorg-}"
          case "$v" in *[!0-9.]*|"") echo "invalid LLVM version: $LLVM_VERSION"; exit 1 ;; esac
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Verify the pinned LLVM source release
        run: ./scripts/build-mlir-tools.sh --version "$LLVM_VERSION" --workdir w --verify-only

      - name: Select platforms
        id: matrix
        run: |
          all='[
            {"platform":"linux-x64","os":"ubuntu-22.04"},
            {"platform":"linux-arm64","os":"ubuntu-22.04-arm"},
            {"platform":"macos-x64","os":"macos-15-intel"},
            {"platform":"macos-arm64","os":"macos-15"},
            {"platform":"windows-x64","os":"windows-2025"}
          ]'
          if [ "$PLATFORMS" = all ]; then
            selected="$all"
          else
            wanted="$(printf '%s' "$PLATFORMS" | tr -d ' ' | jq -R -c 'split(",") | map(select(length > 0))')"
            unknown="$(jq -n -c --argjson all "$all" --argjson w "$wanted" '$w - [$all[].platform]')"
            [ "$unknown" = "[]" ] || { echo "unknown platform(s): $unknown"; exit 1; }
            selected="$(jq -n -c --argjson all "$all" --argjson w "$wanted" '[$all[] | select(.platform as $p | $w | index($p))]')"
          fi
          [ "$(jq length <<<"$selected")" -gt 0 ] || { echo "no platforms selected"; exit 1; }
          echo "matrix=$(jq -c '{include: .}' <<<"$selected")" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      MLIR_TOOLS_ATTESTATION: auto
      LLVM_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: command -v ninja || { sudo apt-get update && sudo apt-get install -y ninja-build; }

      - name: Fetch, verify and build
        shell: bash
        run: ./scripts/build-mlir-tools.sh --version "$LLVM_VERSION" --platform "${{ matrix.platform }}" --workdir w --outdir dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mlir-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  release:
    needs: [plan, build]
    # A release always carries every platform, so its SHA256SUMS covers the full set.
    # Runs for a subset of platforms only upload workflow artifacts.
    if: inputs.release && inputs.platforms == 'all'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          cat mlir-*.sha256 > SHA256SUMS
          rm mlir-*.sha256
          sha256sum -c SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: 'dist/mlir-*'

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: llvmorg-${{ needs.plan.outputs.version }}
          name: MLIR Tools (llvmorg-${{ needs.plan.outputs.version }})
          body: |
            `mlir-opt` and `mlir-translate` built from the signed LLVM ${{ needs.plan.outputs.version }} source release
            (`llvm-project-${{ needs.plan.outputs.version }}.src.tar.xz`, pinned in `versions.txt`).

            Verify a download:

                sha256sum -c SHA256SUMS --ignore-missing
                gh attestation verify mlir-linux-x64.tar.gz --repo ${{ github.repository }}
          files: |
            dist/mlir-*
            dist/SHA256SUMS
          fail_on_unmatched_files: true
